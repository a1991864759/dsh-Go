name: build-apk

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Apply shell tool patch (optional)
        run: |
          if [ -f 0001-add-shell-tool.patch ] && git apply --check 0001-add-shell-tool.patch 2>/dev/null; then
            git apply --verbose 0001-add-shell-tool.patch
          else
            echo "no patch to apply (change is already in the tree)"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install toolchain deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd file gpgv

      - name: Cache runtime image
        uses: actions/cache@v4
        with:
          path: |
            runtime/out
            runtime/.cache
          key: runtime-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/*.json') }}

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('app/pubspec.lock') }}

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}

      - name: Build runtime (arm64-v8a)
        run: bash runtime/build-runtime.sh arm64-v8a
        env:
          # 上游 noble 归档会把旧 deb 换掉，锁文件里的 ca-certificates 会 404；
          # 每次都按 InRelease 签名重新解析一遍，顺便把新锁传上来存档。
          UPDATE_DEB_LOCK: 1

      - name: Build APK
        run: DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64

      - name: Show artifacts
        run: |
          find app/build/app/outputs -name '*.apk' -exec ls -lh {} \;
          echo "--- signer ---"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs app/build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -5 || true

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deb-lock-arm64
          path: runtime/locks/ubuntu-noble-arm64.json
          if-no-files-found: warn
          retention-days: 2
